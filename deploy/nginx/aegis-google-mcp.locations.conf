# Aegis Google OAuth MCP — included from soros.conf (aegis.infrasingularity.com:443).
# Managed by scripts/setup_nginx.sh — do not edit on the server directly.

# OAuth protected-resource discovery (RFC 9728) — mcp-remote hits this at the domain root.
location = /.well-known/oauth-protected-resource/google/mcp {
    proxy_pass http://127.0.0.1:8010/.well-known/oauth-protected-resource/google/mcp;
    proxy_set_header X-Forwarded-Prefix /google;
    include /etc/nginx/snippets/proxy-mcp-streamable.conf;
}

# RFC 8414 issuer-path metadata (some clients probe this before issuer/.well-known/...).
location = /.well-known/oauth-authorization-server/google {
    proxy_pass http://127.0.0.1:8010/.well-known/oauth-authorization-server;
    proxy_set_header X-Forwarded-Prefix /google;
    include /etc/nginx/snippets/proxy-mcp-streamable.conf;
}

# Stale cached metadata may still reference canonical /google-mcp paths — proxy them too.
location /google-mcp/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header X-Forwarded-Prefix /google;
    proxy_redirect http://127.0.0.1:8010/ https://$host/google/;
    proxy_redirect https://$host/google-mcp/ https://$host/google/;
    proxy_redirect https://$host/mcp https://$host/google/mcp;
    include /etc/nginx/snippets/proxy-mcp-streamable.conf;
}

# OAuth Google MCP — streamable-http (POST + long-lived SSE GET on /mcp).
location /google/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header X-Forwarded-Prefix /google;
    proxy_redirect http://127.0.0.1:8010/ https://$host/google/;
    proxy_redirect https://$host/mcp https://$host/google/mcp;
    proxy_redirect http://$host/mcp http://$host/google/mcp;
    include /etc/nginx/snippets/proxy-mcp-streamable.conf;
}
